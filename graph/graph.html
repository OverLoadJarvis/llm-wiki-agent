    "markdown": "---\ntitle: \"全面从严治党\"\ntype: concept\ntags: [中国共产党, 党建, 反腐败]\nsources: [习近平学习四中全会精神, 以正确选人用人导向激励干部担当作为, gaobiaozhun-gaozhiliang-fazhan-dangyuan-gongzuo]\nlast_updated: 2026-05-20\n---\n\n全面从严治党是中国共产党推进党的建设新的伟大工程的重要战略方针，核心是加强党的长期执政能力建设、先进性和纯洁性建设。包括政治建设、思想建设、组织建设、作风建设、纪律建设，把制度建设贯穿其中，深入推进反腐败斗争。\n\n## 关键要素\n- 政治建设：确保党中央权威和集中统一领导\n- 思想建设：用[[习近平新时代中国特色社会主义思想]]武装全党\n- 组织建设：健全组织体系，优化干部和党员队伍\n- 作风建设：落实中央八项规定精神，反对形式主义、官僚主义\n- 纪律建设：严格执行党的纪律，特别是政治纪律\n- 反腐败斗争：无禁区、全覆盖、零容忍\n\n## 与党员发展的关系\n2026年修订的《[[中国共产党发展党员工作细则]]》是全面从严治党在党员入口环节的体现，严把政治关、程序关、纪律关，确保新发展党员质量。\n\n## 连接\n- [[中国共产党]]\n- [[党的自我革命]]\n- [[干部队伍建设]]\n- [[发展党员工作]]\n- [[政治标准]]",

    "markdown": "---\ntitle: \"干部队伍建设\"\ntype: entity\ntags: [党的建设, 组织路线, 选人用人, 从严治党, 人才培养]\nsources: ['gaobiaozhun-gaozhiliang-fazhan-dangyuan-gongzuo.md', '以正确选人用人导向激励干部担当作为.md']\n---\n\n# 干部队伍建设\n\n干部队伍建设是中国共产党组织路线的核心内容，是指在党的建设总要求下，通过发展党员、选拔任用、培养锻炼、管理监督等系统性工作，锻造一支忠诚干净担当的高素质专业化干部队伍的战略工程。在wiki语境下，干部队伍建设涵盖两个关键维度：一是从源头抓好党员发展质量，依据修订后的《中国共产党发展党员工作细则》，坚持把政治标准放在首位，用[[习近平新时代中国特色社会主义思想]]凝心铸魂，优化党员队伍结构，注重从青年、产业工人、农民、知识分子中发展党员，并严肃纪律确保程序规范；二是树立正确选人用人导向，以“信念坚定、为民服务、勤政务实、敢于担当、清正廉洁”的新时代好干部标准为遵循，将政治把关贯穿选拔全过程，突出实践锻炼和实绩导向，通过科学考核与严格管理激发干部担当作为。其核心意义在于为党和国家事业提供可靠的组织保障和人才支撑，通过选好人、用对人形成“用一贤人则群贤毕至”的示范效应，并与[[全面从严治党]]、[[高质量发展]]等战略紧密关联，确保党的自我革命与事业发展同频共振。相关行动包括完善政治素质考察、健全干部考核评价体系、加强日常管理监督、落实组织为担当者担当的激励机制等。",

    "markdown": "---\ntitle: \"新质生产力\"\ntype: entity\ntags: ['高质量发展', '科技自立自强', '创新驱动', '现代化产业体系']\nsources: ['overview.md', '中国共产党第二十届中央委员会第四次全体会议公报.md', '习近平学习四中全会精神.md', '十五五规划建议解读.md', '奋进十五五高质量发展新图景.md', '解读党的二十届四中全会精神.md']\n---\n\n# 新质生产力\n\n新质生产力是2025年党的二十届四中全会审议通过的\"十五五\"规划建议中提出的核心经济战略概念，被定位为推动高质量发展的内在要求和核心引擎。其内涵是由技术革命性突破、生产要素创新性配置、产业深度转型升级而催生的先进生产力质态。在\"十五五\"规划中，新质生产力的核心在于\"加快高水平科技自立自强\"，通过统筹教育、科技、人才一体化发展，引领科技创新突破，并将其作为巩固壮大实体经济根基、建设以先进制造业为骨干的现代化产业体系的关键抓手。该概念强调摆脱传统经济增长方式和生产力发展路径，具有高科技、高效能、高质量特征，其战略意义在于为中国在\"十五五\"时期基本实现社会主义现代化夯实基础。全会公报将\"发展新质生产力\"与\"建设强大国内市场\"、\"扩大高水平对外开放\"、\"统筹发展和安全\"等重大战略举措紧密结合，共同构成了\"十五五\"时期高质量发展的系统性框架。",

    "path": "wiki\\entities\\高质量发展.md",
    "markdown": "---\ntitle: \"高质量发展\"\ntype: entity\ntags: [中国式现代化, 十五五规划, 新质生产力, 现代化产业体系]\nsources: ['overview.md', '中国共产党第二十届中央委员会第四次全体会议公报.md', '习近平学习四中全会精神.md', '以正确选人用人导向激励干部担当作为.md', '十五五规划建议解读.md', '奋进十五五高质量发展新图景.md', '解读党的二十届四中全会精神.md']\n---\n\n# 高质量发展\n\n## 定义\n\n高质量发展是“十五五”时期经济社会发展的主题和党执政兴国的第一要务，是中国式现代化的本质要求和全面建设社会主义现代化国家的首要任务。在党的二十届四中全会审议通过的“十五五”规划建议中，高质量发展被确立为“五个以”根本性要求和“六个坚持”原则的核心内容。它超越了单纯追求GDP增长的传统观念，要求推动经济实现质的有效提升和量的合理增长，涵盖经济、政治、文化、社会、生态文明等各方面的全面协调发展。\n\n## 核心内涵与行动方向\n\n高质量发展是多维度、系统性的发展理念，核心包括以下方面：\n- **发展新质生产力**：以高水平科技自立自强为引领，将科技创新作为高质量发展的内在要求和核心驱动力，统筹教育、科技、人才一体化发展，培育壮大新产业、新模式、新动能。\n- **建设现代化产业体系**：巩固壮大实体经济根基，保持制造业合理比重，坚持智能化、绿色化、融合化方向，构建以先进制造业为骨干的现代化产业体系。\n- **构建新发展格局**：以扩大内需为战略基点，做强国内大循环，畅通国内国际双循环，同时稳步扩大制度型开放，开创高水平对外开放新局面。\n- **促进共同富裕与绿色转型**：扎实推进全体人民共同富裕，加快经济社会发展全面绿色转型，建设美丽中国，确保发展成果由人民共享、发展方式可持续。\n\n## 战略地位与根本保障\n\n高质量发展不仅是经济目标，更是国家治理体系的全面升级。在“十五五”时期，它承前启后，为实现2035年基本实现社会主义现代化的远景目标夯实基础。其顺利推进的根本保障在于：坚持党的全面领导，坚持全面从严治党，以及以正确选人用人导向激励干部担当作为。通过锻造堪当时代重任的高素质干部队伍，将政治标准贯穿实践，让干部在高质量发展一线历练，确保重大战略部署落地见效。",
    "preview": "# 高质量发展 ## 定义 高质量发展是“十五五”时期经济社会发展的主题和党执政兴国的第一要务，是中国式现代化的本质要求和全面建设社会主义现代化国家的首要任务。在党的二十届四中全会审议通过的“十五五”规划建议中，高质量发展被确立为“五个以”根本性要求和“六个坚持”原则的核心内容。它超越了单纯追求GDP增长的传统观念，要求推动经济实现质的有效提升和量的合理增长，涵盖经济、政治、文化、社会、生态文明等各方面的全面协调发展。",

    "type": "source",

    "path": "wiki\\sources\\gaobiaozhun-gaozhiliang-fazhan-dangyuan-gongzuo.md",
    "markdown": "---\ntitle: \"高标准高质量做好发展党员工作——中央组织部负责人就修订颁布《中国共产党发展党员工作细则》答记者问\"\ntype: source\ntags: [中国共产党, 发展党员, 中央组织部, 细则修订, 全面从严治党]\ndate: 2026-05-18\nsource_file: raw/高标准高质量做好发展党员工作——中央组织部负责人就修订颁布《中国共产党发展党员工作细则》答记者问_共产党员网.md\n---\n\n## Summary\n中央组织部负责人在2026年5月18日就新修订的《中国共产党发展党员工作细则》答记者问。修订保持原有7章44条框架，主要从政治标准、思想入党、程序完善、结构优化、纪律严格五个方面进行修改，强调把政治标准放在首位，用[[习近平新时代中国特色社会主义思想]]凝心铸魂，优化党员队伍结构，严肃发展党员工作纪律。修订为新时代新征程做好发展党员工作提供了重要遵循。\n\n## Key Claims\n- 修订背景：2014年5月实施的《细则》需与时俱进，面对新形势新任务，贯彻新时代党的建设总要求和全面从严治党战略方针\n- 五大修订重点：①政治标准放在首位——突出\"两个确立\"\"两个维护\"，政审联审制度；②用[[习近平新时代中国特色社会主义思想]]凝心铸魂，强化思想入党；③完善发展党员程序，优化备案、公示等；④优化党员队伍结构，注重从青年、产业工人、农民、知识分子中发展党员，重视在生产一线和新兴领域发展；⑤严肃纪律，依规依纪处理违规违纪问题\n- 把政治标准放在首位：党章规定的党员标准，深刻领悟\"两个确立\"的决定性意义，增强\"四个意识\"、坚定\"四个自信\"、做到\"两个维护\"，作为重要标准\n- 严肃纪律：列出党组织、相关责任人、违规入党人员等主体的违规情形，与《[[中国共产党纪律处分条例]]》衔接，违规吸收入党的一律不予承认\n- 档案规范：统一制定《入党积极分子培养考察登记表》《预备党员教育考察登记表》式样，鼓励电子化管理\n- 加强领导：纳入党建工作责任制、党委（党组）书记述职评议考核、巡视巡察和党务公开\n\n## Key Quotes\n> \"党员是党的肌体的细胞和党的活动的主体。发展党员工作是党的建设一项重要的基础性工程，关乎党的事业薪火相传、后继有人，关乎党的肌体健康和生机活力。\"\n\n> \"发展政治品质纯洁的党员\"\n\n> \"明确注重从青年和产业工人、农民、知识分子中发展党员，同时增写重视在生产、工作第一线发展党员，做好在新兴领域中发展党员工作\"\n\n## Connections\n- [[中国共产党]] — 主体\n- [[中央组织部]] — 负责部门\n- [[全面从严治党]] — 战略方针\n- [[习近平]] — 重要论述指导\n- [[习近平新时代中国特色社会主义思想]] — 指导思想和思想入核心\n- [[政治标准]] — 首要关口\n- [[两个确立]] — 核心政治要求\n- [[四个意识]] — 标准内容\n- [[四个自信]] — 标准内容\n- [[两个维护]] — 标准内容\n- [[党的自我革命]] — 保持先进性纯洁性\n- [[党内法规]] — 统称\n- [[党的纪律处分条例]] — 衔接法规\n- [[干部队伍建设]] — 延伸关系\n- [[党员档案电子化管理]] — 创新举措\n\n## Contradictions\n",
    "preview": "## Summary 中央组织部负责人在2026年5月18日就新修订的《中国共产党发展党员工作细则》答记者问。修订保持原有7章44条框架，主要从政治标准、思想入党、程序完善、结构优化、纪律严格五个方面进行修改，强调把政治标准放在首位，用[[习近平新时代中国特色社会主义思想]]凝心铸魂，优化党员队伍结构，严肃发展党员工作纪律。修订为新时代新征程做好发展党员工作提供了重要遵循。 ## Key Claims",

    "path": "wiki\\sources\\中国共产党第二十届中央委员会第四次全体会议公报.md",
    "markdown": "---\ntitle: \"中国共产党第二十届中央委员会第四次全体会议公报\"\ntype: source\ntags: [中国共产党, 二十届四中全会, 十五五规划, 全会公报]\ndate: 2025-10-23\nsource_file: raw/中国共产党第二十届中央委员会第四次全体会议公报__中国政府网.md\n---\n\n## Summary\n中国共产党第二十届中央委员会第四次全体会议于2025年10月20日至23日在北京举行。全会审议通过了《中共中央关于制定国民经济和社会发展第十五个五年规划的建议》，提出了\"十五五\"时期经济社会发展的主要目标和重大原则，为基本实现社会主义现代化夯实基础。\n\n## Key Claims\n- \"十五五\"时期是基本实现社会主义现代化夯实基础、全面发力的关键时期\n- 全会提出建设现代化产业体系，巩固壮大实体经济根基，坚持智能化、绿色化、融合化方向\n- 加快高水平科技自立自强，引领发展新质生产力\n- 建设强大国内市场，加快构建新发展格局，坚持扩大内需战略基点\n- 扩大高水平对外开放，稳步扩大制度型开放\n- 加快农业农村现代化，扎实推进乡村全面振兴\n- 优化区域经济布局，促进区域协调发展\n- 加大保障和改善民生力度，扎实推进全体人民共同富裕\n- 加快经济社会发展全面绿色转型，建设美丽中国\n\n## Key Quotes\n> \"实现社会主义现代化是一个阶梯式递进、不断发展进步的历史过程，需要不懈努力、接续奋斗\"\n\n> \"十五五\"时期我国发展环境面临深刻复杂变化，我国发展处于战略机遇和风险挑战并存、不确定难预料因素增多的时期\"\n\n> \"以中国式现代化全面推进中华民族伟大复兴\"\n\n## Connections\n- [[高质量发展]] — 全会主题\n- [[新质生产力]] — 科技自立自强的核心\n- [[共同富裕]] — 民生保障目标\n- [[中国式现代化]] — 奋斗目标\n\n## Contradictions\n",

    "markdown": "---\ntitle: \"习近平：学习好贯彻好党的二十届四中全会精神\"\ntype: source\ntags: [习近平, 中国共产党, 二十届四中全会, 十五五规划, 从严治党]\ndate: 2025-10-23\nsource_file: raw/习近平学习四中全会精神.md\n---\n\n## Summary\n习近平在党的二十届四中全会第二次全体会议上发表重要讲话，强调学习好贯彻好全会精神是当前和今后一个时期全党全国的一项重大政治任务。讲话从深入学习领会、抓好贯彻落实、持之以恒推进全面从严治党三个方面作了部署。\n\n## Key Claims\n- \"十五五\"时期是基本实现社会主义现代化夯实基础、全面发力的关键时期\n- 深刻领会\"十五五\"时期经济社会发展的重大意义、指导思想和重大原则\n- 坚定不移推动高质量发展，发展新质生产力是高质量发展的内在要求\n- 加快构建新发展格局，做强国内大循环、畅通国内国际双循环\n- 推动全体人民共同富裕迈出坚实步伐\n- 更好统筹发展和安全，深入贯彻总体国家安全观\n- 持之以恒推进全面从严治党，包括党的自我革命、作风建设常态化、反腐败斗争\n\n## Key Quotes\n> \"学习好贯彻好全会精神，是当前和今后一个时期全党全国的一项重大政治任务\"\n\n> \"发展新质生产力是高质量发展的内在要求\"\n\n> \"中国式现代化是全体人民共同富裕的现代化\"\n\n> \"治国必先治党，党兴才能国强\"\n\n## Connections\n- [[高质量发展]] — 全会主题和发展目标\n- [[新质生产力]] — 高质量发展的内在要求\n- [[共同富裕]] — 中国式现代化的重要特征\n- [[全面从严治党]] — 根本保证\n- [[国家安全]] — 统筹发展和安全\n\n## Contradictions\n",

    "markdown": "---\ntitle: \"以正确选人用人导向激励干部担当作为\"\ntype: source\ntags: [中国共产党, 选人用人, 干部队伍建设, 从严治党]\ndate: 2026-03-01\nsource_file: raw/以正确选人用人导向激励干部担当作为_共产党员网.md\n---\n\n## Summary\n中共中央组织部发文强调以正确选人用人导向激励干部担当作为，阐述习近平总书记关于选人用人的重要论述，总结党的十八大以来选人用人工作的实践经验。\n\n## Key Claims\n- 鲜明树立选人用人正确导向，着力锻造堪当时代重任的领导班子和干部队伍\n- 新时代好干部标准：信念坚定、为民服务、勤政务实、敢于担当、清正廉洁\n- 突出政治把关，将政治标准贯穿到干部选拔任用的全过程各方面\n- 突出实践锻炼，让干部在急难险重一线历练成长\n- 突出实绩导向，通过科学考核激发干部干劲动力\n- 突出管理监督，以严格要求、奖优惩劣激励干部争先创优\n- 突出组织担当，为敢担当、善作为的干部撑腰鼓劲\n\n## Key Quotes\n> \"选好人、用对人是头等大事\"\n\n> \"用好一个人能激励一大片，用一贤人则群贤毕至，见贤思齐就蔚然成风\"\n\n> \"选什么人就是风向标，就有什么样的干部作风，乃至就有什么样的党风\"\n\n> \"干部越为事业担当，组织越要为干部担当\"\n\n## Connections\n- [[全面从严治党]] — 党的自我革命\n- [[干部队伍建设]] — 组织路线\n- [[高质量发展]] — 实践锻炼平台\n\n## Contradictions\n",

function hexToRgba(color, alpha) {
  if (!color) return `rgba(255, 255, 255, ${alpha})`;
  const normalized = color.replace("#", "");
  const value = normalized.length === 3
    ? normalized.split("").map(ch => ch + ch).join("")
    : normalized;
  const intValue = Number.parseInt(value, 16);
  const r = (intValue >> 16) & 255;
  const g = (intValue >> 8) & 255;
  const b = intValue & 255;
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

function escapeHtml(text) {
  return (text || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function stripFrontmatter(markdown) {
  return (markdown || "").replace(/^---\n[\s\S]*?\n---\n?/, "");
}

function renderInlineMarkdown(text) {
  let html = escapeHtml(text);
  html = html.replace(/\[\[([^\]]+)\]\]/g, '<span class="wikilink">[[$1]]</span>');
  html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
  html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  html = html.replace(/\*([^*]+)\*/g, "<em>$1</em>");
  return html;
}

function renderMarkdown(markdown) {
  const lines = stripFrontmatter(markdown).split(/\r?\n/);
  const html = [];
  let paragraph = [];
  let listType = null;
  let listItems = [];
  let quoteLines = [];
  let inCodeBlock = false;
  let codeLines = [];

  function flushParagraph() {
    if (!paragraph.length) return;
    html.push(`<p>${renderInlineMarkdown(paragraph.join(" "))}</p>`);
    paragraph = [];
  }

  function flushList() {
    if (!listType || !listItems.length) return;
    const items = listItems.map(item => `<li>${renderInlineMarkdown(item)}</li>`).join("");
    html.push(`<${listType}>${items}</${listType}>`);
    listType = null;
    listItems = [];
  }

  function flushQuote() {
    if (!quoteLines.length) return;
    html.push(`<blockquote>${quoteLines.map(line => renderInlineMarkdown(line)).join("<br>")}</blockquote>`);
    quoteLines = [];
  }

  function flushCode() {
    if (!codeLines.length) {
      html.push("<pre><code></code></pre>");
      return;
    }
    html.push(`<pre><code>${escapeHtml(codeLines.join("\n"))}</code></pre>`);
    codeLines = [];
  }

  for (const rawLine of lines) {
    const line = rawLine.replace(/\t/g, "    ");
    const trimmed = line.trim();

    if (trimmed.startsWith("```")) {
      flushParagraph();
      flushList();
      flushQuote();
      if (inCodeBlock) {
        flushCode();
        inCodeBlock = false;
      } else {
        inCodeBlock = true;
      }
      continue;
    }

    if (inCodeBlock) {
      codeLines.push(rawLine);
      continue;
    }

    if (!trimmed) {
      flushParagraph();
      flushList();
      flushQuote();
      continue;
    }

    const headingMatch = trimmed.match(/^(#(1, 6))\s+(.+)$/);
    if (headingMatch) {
      flushParagraph();
      flushList();
      flushQuote();
      const level = headingMatch[1].length;
      html.push(`<h${level}>${renderInlineMarkdown(headingMatch[2])}</h${level}>`);
      continue;
    }

    if (/^(-(3,)|\*(3,))$/.test(trimmed)) {
      flushParagraph();
      flushList();
      flushQuote();
      html.push("<hr>");
      continue;
    }

    const quoteMatch = trimmed.match(/^>\s?(.*)$/);
    if (quoteMatch) {
      flushParagraph();
      flushList();
      quoteLines.push(quoteMatch[1]);
      continue;
    }
    flushQuote();

    const unorderedMatch = trimmed.match(/^[-*]\s+(.+)$/);
    if (unorderedMatch) {
      flushParagraph();
      if (listType && listType !== "ul") flushList();
      listType = "ul";
      listItems.push(unorderedMatch[1]);
      continue;
    }

    const orderedMatch = trimmed.match(/^\d+\.\s+(.+)$/);
    if (orderedMatch) {
      flushParagraph();
      if (listType && listType !== "ol") flushList();
      listType = "ol";
      listItems.push(orderedMatch[1]);
      continue;
    }

    flushList();
    paragraph.push(trimmed);
  }

  if (inCodeBlock) flushCode();
  flushParagraph();
  flushList();
  flushQuote();
  return html.join("");
}

function rebuildAdjacency(filteredEdges) {
  adjacency.clear();
  for (const node of originalNodes) {
    adjacency.set(node.id, new Set());
  }
  for (const edge of filteredEdges) {
    if (!adjacency.has(edge.from)) adjacency.set(edge.from, new Set());
    if (!adjacency.has(edge.to)) adjacency.set(edge.to, new Set());
    adjacency.get(edge.from).add(edge.to);
    adjacency.get(edge.to).add(edge.from);
  }
}

function currentEdgeState() {
  const minConf = parseInt(controls.confSlider.value, 10) / 100;
  controls.confValue.textContent = minConf.toFixed(2);
  return {
    showExtracted: controls.extracted.checked,
    showInferred: controls.inferred.checked,
    showAmbiguous: controls.ambiguous.checked,
    minConf,
  };
}

function passesEdgeFilters(edge, edgeState) {
  const typeOk = (edge.type === "EXTRACTED" && edgeState.showExtracted)
    || (edge.type === "INFERRED" && edgeState.showInferred)
    || (edge.type === "AMBIGUOUS" && edgeState.showAmbiguous);
  const confOk = (edge.confidence ?? 1.0) >= edgeState.minConf;
  return typeOk && confOk;
}

function searchNodes(q) {
  applyFilters(q, activeNodeId);
}

function clearSelection() {
  activeNodeId = null;
  closeDrawer();
  applyFilters(searchInput.value, null);
}

function closeDrawer() {
  document.getElementById("drawer").classList.remove("open");
}

function openDrawer(node, relatedIds) {
  document.getElementById("drawer").classList.add("open");
  document.getElementById("drawer-title").textContent = node.label;
  const communityText = Number.isInteger(node.group) && node.group >= 0 ? ` · community ${node.group}` : "";
  document.getElementById("drawer-meta").textContent = `${node.type}${communityText}`;
  document.getElementById("drawer-path").textContent = node.path;
  document.getElementById("drawer-preview").textContent = node.preview || "";
  document.getElementById("drawer-markdown").innerHTML = renderMarkdown(node.markdown || "");

  const relatedList = document.getElementById("drawer-related-list");
  relatedList.innerHTML = "";
  const relatedNodes = originalNodes
    .filter(item => relatedIds.has(item.id) && item.id !== node.id)
    .sort((a, b) => a.label.localeCompare(b.label));

  if (relatedNodes.length === 0) {
    const empty = document.createElement("span");
    empty.textContent = "No directly connected nodes";
    relatedList.appendChild(empty);
    return;
  }

  for (const related of relatedNodes) {
    const chip = document.createElement("button");
    chip.className = "related-chip";
    chip.textContent = related.label;
    chip.onclick = () => focusNode(related.id);
    relatedList.appendChild(chip);
  }
}

function applyFilters(query = searchInput.value, selectedNodeId = activeNodeId) {
  const lower = (query || "").trim().toLowerCase();
  const edgeState = currentEdgeState();
  const filteredEdges = originalEdges.filter(edge => passesEdgeFilters(edge, edgeState));
  rebuildAdjacency(filteredEdges);

  const relatedIds = selectedNodeId
    ? new Set([selectedNodeId, ...(adjacency.get(selectedNodeId) || [])])
    : null;
  const filteredNodeIds = new Set();
  for (const edge of filteredEdges) {
    filteredNodeIds.add(edge.from);
    filteredNodeIds.add(edge.to);
  }

  let visibleNodeCount = 0;
  const nodeUpdates = originalNodes.map(node => {
    const matchesSearch = !lower || node.label.toLowerCase().includes(lower);
    const isActive = selectedNodeId === node.id;
    const isConnected = filteredNodeIds.has(node.id);
    const isRelated = !relatedIds || relatedIds.has(node.id);
    const hidden = !selectedNodeId && !lower && !isConnected;
    const emphasized = matchesSearch && isRelated && (isConnected || !!lower || isActive);

    if (!hidden) {
      visibleNodeCount += 1;
    }

    return {
      id: node.id,
      hidden,
      color: {
        background: emphasized ? node.color : hexToRgba(node.color, hidden ? 0.05 : 0.14),
        border: emphasized ? hexToRgba(node.color, 0.96) : hexToRgba(node.color, hidden ? 0.08 : 0.22),
        highlight: { background: node.color, border: hexToRgba(node.color, 1) },
        hover: { background: node.color, border: hexToRgba(node.color, 1) },
      },
      font: {
        color: emphasized ? "#f2f3f8" : hidden ? "rgba(242,243,248,0.08)" : "rgba(242,243,248,0.2)",
      },
      borderWidth: isActive ? 5 : 2,
      size: isActive ? 18 : 12,
    };
  });

  const edgeUpdates = originalEdges.map(edge => {
    const enabled = passesEdgeFilters(edge, edgeState);
    if (!enabled) {
      return { id: edge.id, hidden: true };
    }

    const matchesSearch = !lower
      || nodeMap.get(edge.from)?.label.toLowerCase().includes(lower)
      || nodeMap.get(edge.to)?.label.toLowerCase().includes(lower);
    const isRelated = !relatedIds || relatedIds.has(edge.from) || relatedIds.has(edge.to);
    const touchesActive = !!selectedNodeId && (edge.from === selectedNodeId || edge.to === selectedNodeId);
    const emphasized = matchesSearch && isRelated;

    return {
      id: edge.id,
      hidden: false,
      width: touchesActive ? 2.8 : emphasized ? 1.2 : 0.6,
      color: emphasized ? edge.color : hexToRgba(edge.color, 0.08),
    };
  });

  nodes.update(nodeUpdates);
  edges.update(edgeUpdates);

  if (selectedNodeId) {
    const activeNode = nodeMap.get(selectedNodeId);
    if (activeNode) {
      openDrawer(activeNode, relatedIds || new Set([selectedNodeId]));
    }
  }

  const focusSuffix = selectedNodeId && nodeMap.get(selectedNodeId)
    ? ` · focused: ${nodeMap.get(selectedNodeId).label}`
    : "";
  stats.textContent = `${visibleNodeCount} nodes · ${filteredEdges.length} edges${focusSuffix}`;
}

const container = document.getElementById("graph");

// Adaptive physics based on graph size
const nodeCount = originalNodes.length;
const gravConst = nodeCount > 80 ? -8000 : nodeCount > 30 ? -5000 : -2000;
const springLen = nodeCount > 80 ? 250 : nodeCount > 30 ? 200 : 150;

const network = new vis.Network(container, { nodes, edges }, {
  nodes: {
    shape: "dot",
    font: { color: "#ddd", size: 12, strokeWidth: 3, strokeColor: "#111" },
    borderWidth: 1.5,
    scaling: {
      min: 8,
      max: 40,
      label: { enabled: true, min: 10, max: 20, drawThreshold: 6, maxVisible: 24 },
    },
  },
  edges: {
    width: 0.8,
    smooth: { type: "continuous" },
    arrows: { to: { enabled: true, scaleFactor: 0.4 } },
    color: { inherit: false },
    hoverWidth: 2,
  },
  physics: {
    stabilization: { iterations: 250, updateInterval: 25, fit: true },
    barnesHut: { gravitationalConstant: gravConst, springLength: springLen, springConstant: 0.02, damping: 0.15 },
    minVelocity: 0.75,
  },
  interaction: { hover: true, tooltipDelay: 150, hideEdgesOnDrag: true, hideEdgesOnZoom: true },
});

// Ensure the graph fits the viewport after physics stabilization
network.once("stabilizationIterationsDone", function () {
  network.fit({ animation: { duration: 400, easingFunction: "easeInOutQuad" } });
});

function focusNode(nodeId) {
  activeNodeId = nodeId;
  applyFilters(searchInput.value, nodeId);
  const node = nodeMap.get(nodeId) || nodes.get(nodeId);
  const relatedIds = new Set([nodeId, ...(adjacency.get(nodeId) || [])]);
  openDrawer(node, relatedIds);
  network.focus(nodeId, {
    scale: 1.1,
    animation: { duration: 300, easingFunction: "easeInOutQuad" },
  });
}

network.on("click", params => {
  if (params.nodes.length > 0) {
    focusNode(params.nodes[0]);
  } else {
    clearSelection();
  }
});

applyFilters();
</script>
</body>
